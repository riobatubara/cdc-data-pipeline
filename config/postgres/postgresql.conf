# PostgreSQL config for Debezium CDC

# Enable logical replication
wal_level = logical

# Replication slots and senders
max_wal_senders = 10
max_replication_slots = 10

# Recommended settings for streaming
max_wal_size = 1GB
min_wal_size = 80MB
wal_keep_size = 256MB

# Logging
log_statement = 'all'
log_replication_commands = on
