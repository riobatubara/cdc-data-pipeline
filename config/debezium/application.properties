# Debezium Server Configuration

# Sink type : kafka
debezium.sink.type=kafka
debezium.sink.kafka.producer.bootstrap.servers=kafka:9092
debezium.sink.kafka.producer.key.serializer=org.apache.kafka.common.serialization.StringSerializer
debezium.sink.kafka.producer.value.serializer=org.apache.kafka.common.serialization.StringSerializer
debezium.format.key=json
debezium.format.value=json

# Source connector : postgres
debezium.source.connector.class=io.debezium.connector.postgresql.PostgresConnector
debezium.source.database.hostname=postgres
debezium.source.database.port=5432
debezium.source.database.user=debezium
debezium.source.database.password=dbz_password
debezium.source.database.dbname=airflow
debezium.source.database.server.name=pg_server
debezium.source.plugin.name=pgoutput
debezium.source.topic.prefix=pg_server
debezium.source.table.include.list=public.orders

# Replication configuration
debezium.source.slot.name=debezium_slot
debezium.source.publication.name=debezium_pub
debezium.source.publication.autocreate.mode=filtered

# Offset storage
debezium.source.offset.storage.file.filename=data/offsets.dat
debezium.source.offset.flush.interval.ms=1000

# Logging
quarkus.log.console.json=false
quarkus.log.console.enable=true
quarkus.log.console.level=INFO
quarkus.log.console.format=%d{HH:mm:ss} %-5p [%c{1}] %s%e%n
quarkus.log.console.exceptions=summary

# Silence noisy libs
quarkus.log.category."io.debezium".level=ERROR
quarkus.log.category."io.quarkus".level=ERROR
quarkus.log.category."org.apache.kafka".level=ERROR
quarkus.log.category."org.postgresql".level=ERROR
quarkus.log.category."org.jboss".level=ERROR
quarkus.log.category."io.smallrye".level=ERROR
quarkus.log.category."io.vertx".level=ERROR
quarkus.log.category."org.reflections".level=ERROR
